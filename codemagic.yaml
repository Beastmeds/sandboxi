workflows:
  ios-unsigned:
    name: BeastSandbox Unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      vars:
        XCODE_PROJECT: "BeastSandbox.xcodeproj"
        XCODE_SCHEME: "BeastSandbox"
      xcode: latest

    scripts:
      - name: Build unsigned
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPA
        script: |
          APP_PATH=$(find build -name "*.app" | head -1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r BeastSandbox.ipa Payload/

    artifacts:
      - BeastSandbox.ipa
